name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Shell tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: |
          for file in bin/st bin/st-lib/*.sh install.sh tests/*.sh scripts/*.sh; do
            bash -n "$file"
          done
      - name: Run tests
        run: |
          for file in tests/*.sh; do
            bash "$file"
          done
