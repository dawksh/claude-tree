# claude-tree bindings — sourced from ~/.tmux.conf
# Only uses keys the base config leaves free (M-arrows and S-Enter stay as-is).

bind -n M-w display-popup -E -w 70% -h 60% "~/.local/bin/ct go --picker"
bind -n M-e run-shell "~/.local/bin/ct toggle"

# windows by name, so base-index stays whatever you had
bind -n M-1 select-window -t :claude
bind -n M-2 select-window -t :vim
bind -n M-3 select-window -t :shell

# which worktree am I typing into
set -g status-left ' #S '
set -g status-left-length 40

# close the current tree's session (worktree kept; ct resume brings it back)
bind -n M-q confirm-before -p "close this tree? (y/n) " "run-shell '~/.local/bin/ct down -y'"
